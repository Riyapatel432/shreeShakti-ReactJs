<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shree Shakti Engineering Works</title>
  </head>
  <body>
    <div id="root">
      <style>
        .initial-loader {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background-color: #f4f6f8;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          z-index: 9999;
        }
        .dark-theme-loader {
          background-color: #121212;
          color: #f8fafc;
        }
        .spinner {
          width: 50px;
          height: 50px;
          border: 4px solid rgba(27, 58, 87, 0.1);
          border-left-color: #1b3a57;
          border-radius: 50%;
          animation: spin 1s linear infinite;
          margin-bottom: 20px;
        }
        .dark-theme-loader .spinner {
          border: 4px solid rgba(96, 165, 250, 0.1);
          border-left-color: #60a5fa;
        }
        .brand-text {
          font-size: 1.25rem;
          font-weight: 600;
          color: #111827;
          letter-spacing: 0.05em;
          margin-bottom: 5px;
        }
        .dark-theme-loader .brand-text {
          color: #f8fafc;
        }
        .loading-text {
          font-size: 0.875rem;
          color: #6b7280;
        }
        .dark-theme-loader .loading-text {
          color: #94a3b8;
        }
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      </style>
      <div id="initial-loader-container" class="initial-loader">
        <div class="spinner"></div>
        <div class="brand-text">Shree Shakti Engineering Works</div>
        <div class="loading-text">Starting system...</div>
      </div>
      <script>
        try {
          const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) {
            document.getElementById('initial-loader-container').classList.add('dark-theme-loader');
          }
        } catch (e) {}
      </script>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
